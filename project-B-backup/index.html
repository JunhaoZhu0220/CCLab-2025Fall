<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCLab Project - Retro Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    
    <style>
      /* 全局样式 */
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        font-family: 'Courier New', Courier, monospace;
        color: #0f0;
        overflow: hidden;
      }

      /* 你的主容器样式 */
      .main-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }

      h1 {
        margin: 10px 0;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 5px #0f0;
        z-index: 10;
      }

      #p5-canvas-container {
        position: relative;
        width: 100%;
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 20;
        background: rgba(0, 0, 0, 0.6);
        cursor: pointer;
      }
      
      #overlay p {
        font-size: 18px;
        background: #000;
        padding: 10px 20px;
        border: 1px solid #0f0;
        box-shadow: 0 0 10px #0f0;
      }
    </style>
  </head>

<body>

  <div class="main-wrapper">
    <h1>Project B Prototype</h1>

    <!-- the following div will contain the p5 canvas. -->
    <div id="p5-canvas-container">
      <!-- p5 canvas will be appended here. -->
       <div id="overlay">
            <p>&gt; CLICK TO INITIALIZE AUDIO &lt;</p>
        </div>
    </div>
  </div>

  <!-- the script tag below should always be at the bottom, right before the closing body tag -->
  <script src="sketch.js"></script>
</body>

</html>
